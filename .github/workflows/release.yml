name: Release

# 打版本 tag 后自动完成一条完整发布链：
#   测试门禁 → 构建镜像并推送 GHCR → docker save 出离线包 → 建 GitHub Release 挂附件
#
# 用法（维护者）：
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 只认 v<主>.<次>.<修订> 形式的 tag，可带 -rc1 之类的预发布后缀。
# 发布失败要重来：在 Actions 页面点 "Re-run all jobs"（保持同一个 tag 最省事），
# 或者删掉 tag 重新推：git push --delete origin v1.0.0 之后再 tag / push。

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# 默认最小权限，只有真正需要写权限的 job 才单独提升
permissions:
  contents: read

# 同一个 tag 同时只跑一条发布流水线，避免并发写同一个 Release
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 1) 门禁：直接复用 ci.yml 里的 lint + pytest，避免两处各写一份
  #    （tag 推送不满足 ci.yml 的 branches 条件，不会自动触发，所以这里显式调用）
  test:
    name: 测试门禁
    uses: ./.github/workflows/ci.yml

  # 2) 构建推送镜像 + 生成离线包 + 建 Release
  release:
    name: 构建镜像并发布
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # 建 Release、上传附件
      packages: write # 推送镜像到 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 不接受大写镜像名，而仓库名是 MCTTK，这里统一转小写：
      # ghcr.io/jiubook/MCTTK → ghcr.io/jiubook/mcttk
      - name: 解析镜像名与版本号
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "GHCR_IMAGE=${IMAGE}"
            echo "VERSION=${VERSION}"
          } >> "$GITHUB_ENV"
          echo "本次发布镜像：${IMAGE}:${VERSION}"

      # 只是提示，不拦发布：镜像版本始终以 tag 为准，pyproject.toml 仅作参考
      - name: 检查 tag 与 pyproject 版本是否一致
        continue-on-error: true
        run: |
          PYVER=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$PYVER" != "$VERSION" ]; then
            echo "::warning::tag 版本 ${VERSION} 与 pyproject.toml 的 ${PYVER} 不一致，本次按 tag 版本发布"
          else
            echo "版本一致：${VERSION}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 由 tag 自动推导镜像标签：
      #   v1.0.0      → 1.0.0 / 1.0 / latest
      #   v1.0.0-rc1  → 只有 1.0.0-rc1（不覆盖 1.0 和 latest）
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          # 关掉 flavor 的 latest=auto，避免它给预发布也补一个 latest；
          # 下面的 type=raw 已经显式控制 latest 该不该出
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=MCTTK 矿译通
            org.opencontainers.image.description=Minecraft 新闻自动爬取 + 翻译 + 发布
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关掉 provenance：否则会额外推一个 attestation manifest，
          # 老版本 Docker 在 docker save / docker load 时容易报错
          provenance: false

      # build-push-action 的 push 和 load 不能同时开启，
      # 所以离线包从 registry 拉回来再 save（层命中构建缓存，代价很小）
      - name: 生成离线镜像包（docker save）
        run: |
          set -euo pipefail
          IMG="${GHCR_IMAGE}:${VERSION}"
          TAR="mcttk-${GITHUB_REF_NAME}.tar"
          # 刚推送的镜像偶发要等一下才能拉，这里重试几次
          for i in 1 2 3 4 5; do
            if docker pull "$IMG"; then
              break
            fi
            echo "第 ${i} 次拉取失败，10 秒后重试"
            sleep 10
          done
          docker image inspect "$IMG" > /dev/null
          # 刻意不压缩：部分内网/私有云平台与国产容器引擎的「导入镜像」只收未压缩 tar，
          # .tar.gz 会直接报错（docker load 本身能读压缩包，但这些平台不是走 docker load）。
          # 校验和不再单独上传：GitHub 会给每个 Release 附件自动生成 SHA256 digest。
          docker save -o "$TAR" "$IMG"
          ls -lh "$TAR"

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 由 GitHub 依据提交历史自动生成变更说明
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            mcttk-${{ github.ref_name }}.tar
