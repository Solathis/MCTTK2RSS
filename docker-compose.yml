version: '3.8'

services:
  mcttk2rss:
    # 方式一：使用 GHCR 预构建镜像（推荐，无需本地构建）
    image: ghcr.io/solathis/mcttk2rss:latest
    # 方式二：本地构建（取消注释下面一行，注释掉上面的 image）
    # build: .
    container_name: mcttk2rss
    restart: unless-stopped
    ports:
      # RSS Feed HTTP 服务端口
      - "8080:8080"
    volumes:
      # 输出目录（feed.xml 在此生成，容器写回宿主机）
      - ./output:/app/output
      # 日志目录
      - ./logs:/app/logs
      # 配置文件只读挂载（修改后重启容器生效）
      - ./config.json:/app/config.json:ro
      - ./glossary.json:/app/glossary.json:ro
    # 所有配置均从 config.json 读取，不使用环境变量
    mem_limit: 512m
    mem_reservation: 256m
