version: '3.8'

services:
  mcttk-rss:
    build: .
    container_name: mcttk-rss
    restart: unless-stopped
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
      - ./glossary.json:/app/glossary.json:ro
      - ./main.py:/app/main.py:ro
      - ./scraper.py:/app/scraper.py:ro
      - ./rss_generator.py:/app/rss_generator.py:ro
      - ./utils.py:/app/utils.py:ro
      - ./scheduler.py:/app/scheduler.py:ro
      - ./init_state.py:/app/init_state.py:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    mem_limit: 512m
    mem_reservation: 256m
