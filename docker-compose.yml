version: '3.8'

services:
  mcttk-rss:
    # 方式一：使用 GHCR 预构建镜像（推荐，无需本地构建）
    image: ghcr.io/solathis/mcttk2rss:latest
    # 方式二：本地构建（取消注释下面一行，注释掉上面的 image）
    # build: .
    container_name: mcttk-rss
    restart: unless-stopped
    volumes:
      # 输出目录（feed.xml 在此生成，容器写回宿主机）
      - ./output:/app/output
      # 日志目录
      - ./logs:/app/logs
      # 配置文件只读挂载（修改后重启容器生效）
      - ./config.json:/app/config.json:ro
      - ./glossary.json:/app/glossary.json:ro
    # 所有配置均从 config.json 读取，不使用环境变量
    mem_limit: 512m
    mem_reservation: 256m

  # Nginx 提供 RSS Feed 的 HTTP 访问
  rss-server:
    image: nginx:alpine
    container_name: mcttk-rss-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # 将 output 目录以只读方式挂载到 nginx 提供访问
      - ./output:/usr/share/nginx/html:ro
    depends_on:
      - mcttk-rss
