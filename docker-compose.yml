version: '3.8'

services:
  mcttk:
    build: .
    container_name: mcttk-scraper
    restart: unless-stopped
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      # 配置整目录只读挂载（config.json / modules_config.json）
      - ./config:/app/config:ro
      # 词表整目录只读挂载：自动词表缺失时不会在容器里被误建成同名目录
      # 自动词表由宿主机手动 `python tools/sync_glossary.py` 生成，
      # 程序运行/容器启动都不会联网更新它（缺失时退回只用 glossary.json）
      - ./glossary:/app/glossary:ro
      - ./main.py:/app/main.py
      - ./log_setup.py:/app/log_setup.py
      - ./scraper.py:/app/scraper.py
      - ./converter.py:/app/converter.py
      - ./poster.py:/app/poster.py
      - ./utils.py:/app/utils.py
      - ./scheduler.py:/app/scheduler.py
      - ./init_state.py:/app/init_state.py
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCBBS_USERNAME=${MCBBS_USERNAME}
      - MCBBS_PASSWORD=${MCBBS_PASSWORD}
      # 日志与调度（可选，未设置时用代码里的默认值）
      - MCTTK_LOG_LEVEL=${MCTTK_LOG_LEVEL:-INFO}
      - MCTTK_LOG_KEEP_DAYS=${MCTTK_LOG_KEEP_DAYS:-90}
      - MCTTK_INTERVAL=${MCTTK_INTERVAL:-3600}
      - MCTTK_RUN_TIMEOUT=${MCTTK_RUN_TIMEOUT:-3600}
    mem_limit: 512m
    mem_reservation: 256m
