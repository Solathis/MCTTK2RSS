version: '3.8'

services:
  mcttk:
    build: .
    container_name: mcttk-scraper
    restart: unless-stopped
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
      - ./modules_config.json:/app/modules_config.json:ro
      - ./glossary.json:/app/glossary.json:ro
      # 自动词表：宿主机手动 `python tools/sync_glossary.py` 生成后挂载，
      # 程序运行/容器启动都不会联网更新它（文件缺失时退回只用 glossary.json）
      - ./glossary.auto.json:/app/glossary.auto.json:ro
      - ./glossary.auto.index.json:/app/glossary.auto.index.json:ro
      - ./main.py:/app/main.py
      - ./scraper.py:/app/scraper.py
      - ./converter.py:/app/converter.py
      - ./poster.py:/app/poster.py
      - ./utils.py:/app/utils.py
      - ./scheduler.py:/app/scheduler.py
      - ./init_state.py:/app/init_state.py
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCBBS_USERNAME=${MCBBS_USERNAME}
      - MCBBS_PASSWORD=${MCBBS_PASSWORD}
    mem_limit: 512m
    mem_reservation: 256m
